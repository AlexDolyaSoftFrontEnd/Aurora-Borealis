.aurora {
position: fixed; inset: -10% -30%;

@keyframes auroraWave {

to   { transform: translate3d(40px,-20px,0); }
}

.parallax-layer {
position: fixed; inset: -30%; width: 160%; height: 160%;
border-radius: 50%; filter: blur(90px);
pointer-events: none; mix-blend-mode: screen; z-index: 1;
}
.layer-1 { background: var(--layer1); }
.layer-2 { background: var(--layer2); }
.layer-3 { background: var(--layer3); }

.fog-layer {

pointer-events: none; mix-blend-mode: screen;
filter: blur(26px); opacity: .42;
}
.fog-top {
background:
radial-gradient(circle at 10% 0%, rgba(255,255,255,0.12), transparent 55%),
radial-gradient(circle at 60% 8%, rgba(220,230,255,0.12), transparent 60%);

}
.fog-bottom {

radial-gradient(circle at 100% 100%, rgba(255,255,255,0.09), transparent 60%);

}

@keyframes fogTop {

@keyframes fogBottom {

<script>
const nameStr="Oleksandr Dolinskyi";let nameIndex=0;
(function type(){
    if(nameIndex<nameStr.length){
        document.getElementById("author").textContent+=nameStr[nameIndex];
        nameIndex++; setTimeout(type,55);
    }
})();
</script>
<script>
const layers=document.querySelectorAll(".parallax-layer");
const fogTop=document.querySelector(".fog-top");
const fogBottom=document.querySelector(".fog-bottom");
const moon=document.querySelector(".moon");
const firefliesEls=document.querySelectorAll(".firefly");

let mouseX=0, mouseY=0, targetX=0, targetY=0;

document.addEventListener("mousemove", e=>{
    targetX=(e.clientX-innerWidth/2)/innerWidth;
    targetY=(e.clientY-innerHeight/2)/innerHeight;
});

function animate(){
    mouseX+=(targetX-mouseX)*0.04;
    mouseY+=(targetY-mouseY)*0.04;

    layers.forEach((layer,i)=>{
        const depth=(i+1)*20;
        layer.style.transform = `translate(${mouseX*depth}px,${mouseY*depth}px)`;
    });

    fogTop.style.transform = `translate(${mouseX*60}px,${mouseY*50}px)`;
    fogBottom.style.transform = `translate(${mouseX*-50}px,${mouseY*-40}px)`;
    moon.style.transform = `translate(${mouseX*-30}px,${mouseY*-20}px)`;

    firefliesEls.forEach((f,i)=>{
        const drift=(i%6)*1.4+1.4;
        f.style.marginLeft=mouseX*drift+"px";
        f.style.marginTop =mouseY*drift+"px";
    });

    requestAnimationFrame(animate);
}
animate();
</script>
