<style>
:root {
    --font: "Inter", system-ui, sans-serif;
    --bg: radial-gradient(circle at 20% 0%, #101826 0%, #050711 35%, #02030a 100%);
    --text: #ffffff;
    --text-medium: rgba(230,233,255,0.7);
    --glass-bg: rgba(8, 12, 26, 0.8);
    --glass-border: rgba(200, 210, 255, 0.22);
    --glass-shadow: 0 20px 60px rgba(0,0,0,0.65);
    --layer1: rgba(30, 160, 110, 0.30);
    --layer2: rgba(80, 110, 255, 0.28);
    --layer3: rgba(180, 90, 255, 0.24);
}

* {
    box-sizing: border-box;
}

html,
body {
    height: 100%;
}

body {
    margin: 0;
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    overflow: hidden;
    text-align: center;
}

.parallax-layer,
.fog-layer,
.moon,
.firefly,
.landing-card {
    transition:
        transform 1.5s cubic-bezier(.15,.55,.25,1),
        opacity 1.4s cubic-bezier(.22,.55,.23,1),
        filter 1.4s cubic-bezier(.22,.55,.23,1);
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.9) 0 1px, transparent 1px),
        radial-gradient(circle at 30% 80%, rgba(255,255,255,0.8) 0 1px, transparent 1px),
        radial-gradient(circle at 70% 30%, rgba(220,230,255,0.8) 0 1px, transparent 1px),
        radial-gradient(circle at 90% 60%, rgba(255,255,255,0.7) 0 1px, transparent 1px);
    background-size: 300px 300px, 260px 260px, 340px 340px, 380px 380px;
    background-repeat: repeat;
    opacity: 0.55;
}

.aurora {
    position: fixed;
    inset: -10% -30%;
    pointer-events: none;
    z-index: 1;
    background: linear-gradient(120deg,
        rgba(60,255,190,0.0) 0%,
        rgba(60,255,190,0.32) 30%,
        rgba(120,140,255,0.34) 55%,
        rgba(220,150,255,0.0) 100%);
    filter: blur(50px);
    opacity: 0.8;
    mix-blend-mode: screen;
    animation: auroraWave 60s ease-in-out infinite alternate;
}

@keyframes auroraWave {
    0% {
        transform: translate3d(-40px,10px,0);
    }
    100% {
        transform: translate3d(40px,-20px,0);
    }
}

.parallax-layer {
    position: fixed;
    inset: -30%;
    width: 160%;
    height: 160%;
    border-radius: 50%;
    filter: blur(90px);
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 1;
}

.layer-1 {
    background: var(--layer1);
}

.layer-2 {
    background: var(--layer2);
}

.layer-3 {
    background: var(--layer3);
}

.fog-layer {
    position: fixed;
    inset: -20%;
    z-index: 3;
    pointer-events: none;
    mix-blend-mode: screen;
    filter: blur(26px);
    opacity: 0.42;
}

.fog-top {
    background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,0.12) 0, transparent 55%),
        radial-gradient(circle at 60% 8%, rgba(220,230,255,0.12) 0, transparent 60%);
    animation: fogTop 90s linear infinite alternate;
}

.fog-bottom {
    background:
        radial-gradient(circle at 0% 100%, rgba(220,230,255,0.14) 0, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(255,255,255,0.09) 0, transparent 60%);
    animation: fogBottom 120s linear infinite alternate;
}

@keyframes fogTop {
    0% {
        transform: translateY(-30px) scale(1.05);
    }
    100% {
        transform: translateY(30px) scale(1.09);
    }
}

@keyframes fogBottom {
    0% {
        transform: translateY(30px) scale(1.05);
    }
    100% {
        transform: translateY(-30px) scale(1.10);
    }
}

.moon {
    position: fixed;
    top: 6vh;
    right: 8vw;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background:
        radial-gradient(circle at 30% 30%, #ffffff 0%, #f4f7ff 40%, #b8c4ff 70%, transparent 100%);
    box-shadow:
        0 0 40px rgba(200,220,255,0.85),
        0 0 90px rgba(140,170,255,0.6);
    z-index: 4;
    pointer-events: none;
}

main {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    z-index: 6;
}

.landing-card {
    width: min(92%, 44rem);
    padding: 2rem 2.4rem;
    background: var(--glass-bg);
    border-radius: 1.4rem;
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(22px) saturate(160%);
    box-shadow: var(--glass-shadow);
    opacity: 0;
    animation: fadeIn 1.4s ease forwards;
}

@keyframes fadeIn {
    to {
        opacity: 1;
    }
}

.title {
    font-size: clamp(1.9rem, 4vw, 3.2rem);
    font-weight: 900;
    margin: 0 0 0.5rem;
    text-shadow: 0 4px 12px rgba(0,0,0,0.6);
}

.author {
    font-size: clamp(1.1rem, 2vw, 1.8rem);
    color: rgba(255,255,255,0.88);
    margin: 0 0 0.4rem;
}

.tagline {
    font-size: clamp(1rem, 1.7vw, 1.3rem);
    color: rgba(255,255,255,0.82);
    margin: 0 0 1.6rem;
}

.actions {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    max-width: 300px;
    margin: 0 auto;
}

.btn {
    padding: 0.9rem 1.8rem;
    border-radius: 100px;
    background: linear-gradient(135deg, #2a7bff, #6a8dff);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: clamp(1rem, 1.8vw, 1.1rem);
    box-shadow: 0 12px 22px rgba(0,0,0,0.4);
    transition: transform .35s ease, box-shadow .35s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 32px rgba(0,0,0,0.6);
}

.firefly {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle,
        rgba(255,255,255,0.9) 0%,
        rgba(120,180,255,0.6) 60%,
        transparent 100%);
    pointer-events: none;
    opacity: 0.32;
    filter: blur(1.2px);
    animation: fly 32s infinite ease-in-out;
    z-index: 5;
}

@keyframes fly {
    0% {
        transform: translate(0,0) scale(0.8);
    }
    25% {
        transform: translate(60px,-120px) scale(1);
    }
    50% {
        transform: translate(-80px,60px) scale(1.2);
    }
    75% {
        transform: translate(30px,-70px) scale(1);
    }
    100% {
        transform: translate(0,0) scale(0.8);
    }
}

@media (max-width: 1024px) {

    }
}

<script>
const nameStr = "Oleksandr Dolinskyi";
let nameIndex = 0;
(function type() {
    if (nameIndex < nameStr.length) {
        document.getElementById("author").textContent += nameStr[nameIndex];
        nameIndex++;
        setTimeout(type, 55);
    }
})();
</script>

<script>
const layers = document.querySelectorAll(".parallax-layer");
const fogTop = document.querySelector(".fog-top");
const fogBottom = document.querySelector(".fog-bottom");
const moon = document.querySelector(".moon");
const firefliesEls = document.querySelectorAll(".firefly");

let mouseX = 0, mouseY = 0;
let targetX = 0, targetY = 0;

document.addEventListener("mousemove", (e) => {
    targetX = (e.clientX - innerWidth / 2) / innerWidth;
    targetY = (e.clientY - innerHeight / 2) / innerHeight;
});

function animate() {
    mouseX += (targetX - mouseX) * 0.04;
    mouseY += (targetY - mouseY) * 0.04;

    layers.forEach((layer, i) => {
        const depth = (i + 1) * 20;
        layer.style.transform =
            "translate(" + (mouseX * depth) + "px, " + (mouseY * depth) + "px)";
    });

    fogTop.style.transform =
        "translate(" + (mouseX * 60) + "px, " + (mouseY * 50) + "px)";
    fogBottom.style.transform =
        "translate(" + (mouseX * -50) + "px, " + (mouseY * -40) + "px)";

    moon.style.transform =
        "translate(" + (mouseX * -30) + "px, " + (mouseY * -20) + "px)";

    firefliesEls.forEach((f, i) => {
        const drift = (i % 6) * 1.4 + 1.4;
        f.style.marginLeft = (mouseX * drift) + "px";
        f.style.marginTop = (mouseY * drift) + "px";
    });

    requestAnimationFrame(animate);
}
animate();
</script>
