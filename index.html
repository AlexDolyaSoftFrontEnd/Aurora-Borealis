    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cdefs%3E%3CradialGradient id='bg' cx='30%25' cy='30%25' r='80%25'%3E%3Cstop offset='0%25' stop-color='hsl(215,100%25,85%25)'/%3E%3Cstop offset='50%25' stop-color='hsl(255,85%25,65%25)'/%3E%3Cstop offset='100%25' stop-color='hsl(280,70%25,55%25)'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect x='90' y='90' width='844' height='844' rx='210' fill='url(%23bg)'/%3E%3C/svg%3E">

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap");

        :root {
            --font: "Inter", sans-serif;

            --fs-h1: clamp(1.9rem, 4.4vw, 3.15rem);
            --fs-author: clamp(1.2rem, 2.5vw, 1.7rem);
            --fs-text: clamp(1rem, 2vw, 1.25rem);
            --fs-btn: clamp(1rem, 1.9vw, 1.15rem);

            --lh-tight: 1.15;
            --lh-base: 1.45;
            --lh-relaxed: 1.6;

            --tracking-tight: -0.02em;
            --tracking-base: -0.01em;

            --bg-base: hsl(232 42% 7%);
            --glass: hsl(230 32% 14% / 0.7);
            --glass-border: hsl(220 80% 90% / 0.22);
            --shadow: 0 35px 90px hsl(240 60% 5% / 0.7);
        }

        body {
            margin: 0;
            font-family: var(--font);
            background: var(--bg-base);
            color: #fff;
            overflow: hidden;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .parallax-bg,
        .parallax__layer {
            position: fixed;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        .parallax-bg {
            inset: -10%;
            width: 120%;
            height: 120%;
            background:
                radial-gradient(circle at 50% 20%, hsl(222 60% 16% / 0.7), transparent 65%),
                radial-gradient(circle at 50% 80%, hsl(260 55% 18% / 0.7), transparent 60%);
            z-index: -3;
            transform: translateZ(-200px) scale(1.2);
        }

        .parallax__layer {
            inset: -40%;
            width: 180%;
            height: 180%;
            mix-blend-mode: screen;
        }

        .parallax__layer:nth-child(2) { transform: translateZ(-100px) scale(1.1); }
        .parallax__layer:nth-child(3) { transform: translateZ(-50px) scale(1.05); }
        .parallax__layer:nth-child(4) { transform: translateZ(0px) scale(1); }

        /* ==============================
           PERFECT VERTICAL + HORIZONTAL CENTER
        =============================== */
        main.landing {
            height: 100vh;
            width: 100%;
            display: grid;
            place-items: center; /* идеальная центровка */
            padding: 2rem;
            position: relative;
        }

        .landing__card {
            max-width: 44rem;
            padding: 2.4rem;
            text-align: center;
            background: var(--glass);
            border-radius: 1.7rem;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(26px) saturate(140%);
            box-shadow: var(--shadow);
            transform: translateZ(60px);
            opacity: 0;
            animation: fadeCard 1.2s ease forwards;
        }

        @keyframes fadeCard {
            to { opacity: 1; }
        }

        .landing__title {
            font-size: var(--fs-h1);
            font-weight: 800;
            line-height: var(--lh-tight);
            letter-spacing: var(--tracking-tight);
            background: linear-gradient(135deg, #fff, #e9edff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.6rem;
        }

        .landing__author {
            font-size: var(--fs-author);
            opacity: .92;
            margin-bottom: .6rem;
            min-height: 2rem;
        }

        .landing__tagline {
            font-size: var(--fs-text);
            opacity: .85;
            margin-bottom: 2rem;
            line-height: var(--lh-relaxed);
        }

        .landing__actions {
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        .landing__button {
            padding: 0.95rem 2rem;
            border-radius: 999px;
            font-size: var(--fs-btn);
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            transition: transform .35s, filter .35s, box-shadow .35s;
        }

        .landing__button:hover {
            transform: translateY(-4px) scale(1.05);
            filter: brightness(1.2);
            box-shadow: 0 0 35px rgba(255,255,255,0.35);
        }

        .landing__button--linkedin {
            background: linear-gradient(135deg, #0a66c2, #3fa8ff);
        }

        .landing__button--telegram {
            background: linear-gradient(135deg, #1b8fff, #55c8ff);
        }

        .landing__button--whatsapp {
            background: linear-gradient(135deg, #1bd267, #37ef87);
        }
    </style>
</head>

<body>
    <div class="parallax-bg"></div>
    <div class="parallax__layer"></div>
    <div class="parallax__layer"></div>
    <div class="parallax__layer"></div>

    <main class="landing">
        <section class="landing__card">
            <h1 class="landing__title">Front-end Developer</h1>
            <p class="landing__author" id="author"></p>
            <p class="landing__tagline">Logic and interface interaction</p>

            <nav class="landing__actions">
                <a href="https://www.linkedin.com/in/sashasoftfrontend/" class="landing__button landing__button--linkedin" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://t.me/sasha_08170" class="landing__button landing__button--telegram" target="_blank" rel="noopener">Telegram</a>
                <a href="https://wa.me/380973234711" class="landing__button landing__button--whatsapp" target="_blank" rel="noopener">WhatsApp</a>
            </nav>
        </section>
    </main>

    <script>
        const text = "Oleksandr Dolinskyi";
        let i = 0;

        (function type() {
            if (i < text.length) {
                document.getElementById("author").textContent += text.charAt(i);
                i++;
                setTimeout(type, 80);
            }
        })();

        let targetX = 0, targetY = 0, currentX = 0, currentY = 0;

        document.addEventListener("mousemove", (e) => {
            targetX = (e.clientX - window.innerWidth / 2) / 180;
            targetY = (e.clientY - window.innerHeight / 2) / 180;
        });

        (function animate() {
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            document.querySelector(".parallax-bg").style.transform =
                `translateZ(-200px) translate(${currentX * 12}px, ${currentY * 12}px)`;

            document.querySelectorAll(".parallax__layer").forEach((layer, i) => {
                const depth = (i + 1) * 40;
                layer.style.transform =
                    `translateZ(${-depth}px) translate(${currentX * depth * 0.1}px, ${currentY * depth * 0.1}px)`;
            });

            requestAnimationFrame(animate);
        })();
    </script>

</body>
