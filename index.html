<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <title>Front-end Developer — Oleksandr Dolinskyi</title>
    <meta name="description" content="Logic and interface interaction." />
    <link rel="canonical" href="https://sashasoftfrontend.github.io/React/" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,
          %3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'%3E
            %3Cdefs%3E
              %3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E
                %3Cstop offset='0%25' stop-color='%23a2d9ff'/%3E
                %3Cstop offset='100%25' stop-color='%23778eff'/%3E
              %3C/linearGradient%3E
            %3C/defs%3E
            %3Crect width='240' height='240' rx='48' fill='url(%23g)'/%3E
            %3Cpath d='M70 120a50 50 0 1 1 50 50' fill='none' stroke='%23fff' stroke-width='18' stroke-linecap='round'/%3E
            %3Cpath d='M120 70v100' stroke='%23fff' stroke-width='18' stroke-linecap='round'/%3E
          %3C/svg%3E">

    <style>
        :root {
            --font: "Inter", system-ui, sans-serif;
            --fs-h1: clamp(1.9rem, 4vw, 3.4rem);
            --fs-author: clamp(1.1rem, 2vw, 1.85rem);
            --fs-text: clamp(1rem, 1.7vw, 1.3rem);
            --fs-btn: clamp(1rem, 1.8vw, 1.15rem);
            --text-dark: #2e2e45;
            --text-medium: #6b6b88;
            --bg: linear-gradient(135deg, #f3f6ff 0%, #ffffff 60%, #eff3ff 100%);
            --glass-bg: rgba(255, 255, 255, 0.58);
            --glass-border: rgba(255, 255, 255, 0.7);
            --glass-shadow: 0 25px 70px rgba(120, 140, 255, 0.25);
            --layer1: rgba(160, 200, 255, 0.25);
            --layer2: rgba(200, 170, 255, 0.25);
            --layer3: rgba(255, 200, 240, 0.25);
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: var(--font);
            color: var(--text-dark);
            overflow: hidden;
            text-align: center;
        }

        .parallax-layer {
            position: fixed;
            inset: -30%;
            width: 160%;
            height: 160%;
            border-radius: 50%;
            filter: blur(60px);
            mix-blend-mode: screen;
            pointer-events: none;
        }

        .parallax-layer:nth-child(1) { background: var(--layer1); transform: translateZ(-180px); }
        .parallax-layer:nth-child(2) { background: var(--layer2); transform: translateZ(-120px); }
        .parallax-layer:nth-child(3) { background: var(--layer3); transform: translateZ(-60px); }

        main {
            height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.6rem;
        }

        .landing-card {
            width: min(90%, 48rem);
            padding: 2.6rem;
            background: var(--glass-bg);
            border-radius: 1.8rem;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(26px) saturate(180%);
            box-shadow: var(--glass-shadow);
            animation: fadeIn 1.1s ease forwards;
            opacity: 0;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .title {
            font-size: var(--fs-h1);
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(
                135deg,
                #3f45ff 0%,
                #6b74ff 35%,
                #9aa7ff 70%,
                #d6e2ff 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.15),
                0 8px 24px rgba(90, 110, 255, 0.25),
                0 0 18px rgba(150, 150, 255, 0.22);
            margin-bottom: .6rem;
            transition: 0.35s ease;
        }

        .title:hover {
            transform: translateY(-3px);
            text-shadow:
                0 4px 10px rgba(0, 0, 0, 0.18),
                0 10px 28px rgba(90, 110, 255, 0.33),
                0 0 24px rgba(160, 160, 255, 0.30);
        }

        .author {
            font-size: var(--fs-author);
            color: var(--text-medium);
            min-height: 2rem;
            margin-bottom: .6rem;
        }

        .tagline {
            font-size: var(--fs-text);
            color: var(--text-medium);
            margin-bottom: 2rem;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 100px;
            text-decoration: none;
            font-size: var(--fs-btn);
            font-weight: 600;
            color: #fff;
            transition: .33s ease;
            box-shadow: 0 10px 24px rgba(0,0,0,0.09);
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px rgba(0,0,0,0.15);
        }

        .linkedin { background: linear-gradient(135deg, #0a66c2, #4aa3ff); }
        .telegram { background: linear-gradient(135deg, #1d9aff, #59d0ff); }
        .whatsapp { background: linear-gradient(135deg, #1fc86b, #3ffc98); }

        @media (max-width: 768px) {
            .parallax-layer { filter: blur(35px); }
            .landing-card { padding: 2rem; }
            .title { font-size: clamp(2rem, 6vw, 2.8rem); }
            .tagline { margin-bottom: 1.4rem; }
        }

        @media (max-width: 480px) {
            body { overflow: auto; }
            .parallax-layer { opacity: 0.35; }
            main { padding: 1.2rem; }
            .landing-card { padding: 1.8rem; border-radius: 1.4rem; }
            .actions { gap: .9rem; }
            .btn { padding: 0.9rem 1.6rem; }
        }

        @media (max-width: 360px) {
            .title { font-size: 1.9rem; }
            .author { font-size: 1.1rem; }
            .btn { font-size: 0.95rem; }
        }
    </style>
</head>

<body>

    <div class="parallax-layer"></div>
    <div class="parallax-layer"></div>
    <div class="parallax-layer"></div>

    <main>
        <section class="landing-card">
            <h1 class="title">Front-end Developer</h1>
            <p class="author" id="author"></p>
            <p class="tagline">Logic and interface interaction</p>

            <div class="actions">
                <a href="https://www.linkedin.com/in/sashasoftfrontend/" class="btn linkedin" target="_blank">LinkedIn</a>
                <a href="https://t.me/sasha_08170" class="btn telegram" target="_blank">Telegram</a>
                <a href="https://wa.me/380973234711" class="btn whatsapp" target="_blank">WhatsApp</a>
            </div>
        </section>
    </main>

    <script>
        const nameStr = "Oleksandr Dolinskyi";
        let index = 0;

        (function type() {
            if (index < nameStr.length) {
                document.getElementById("author").textContent += nameStr[index];
                index++;
                setTimeout(type, 60);
            }
        })();

        const isMobile = window.innerWidth < 768;
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        document.addEventListener("mousemove", e => {
            targetX = (e.clientX - window.innerWidth / 2) / (isMobile ? 600 : 200);
            targetY = (e.clientY - window.innerHeight / 2) / (isMobile ? 600 : 200);
        });

        (function animate() {
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            document.querySelectorAll(".parallax-layer").forEach((layer, i) => {
                const depth = (i + 1) * (isMobile ? 20 : 50);
                layer.style.transform =
                    `translate(${currentX * depth * 0.12}px, ${currentY * depth * 0.12}px)`;
            });

            requestAnimationFrame(animate);
        })();
    </script>

</body>
</html>
