    <style>
        :root {
            --font: 'Inter', system-ui, sans-serif;
            --fs-h1: clamp(2.4rem, 6vw, 4.2rem);
            --fs-author: clamp(1.25rem, 2.8vw, 1.75rem);
            --fs-text: clamp(1.05rem, 2.2vw, 1.3rem);
            --fs-button: clamp(1rem, 2vw, 1.15rem);
            --lh-tight: 1.1;
            --lh-base: 1.6;
            --lh-text: 1.75;
            --space-xs: clamp(10px, 2vw, 16px);
            --space-sm: clamp(16px, 3vw, 24px);
            --space-md: clamp(24px, 4vw, 32px);
            --space-lg: clamp(32px, 6vw, 48px);
            --space-xl: clamp(48px, 10vw, 80px);
            --text-glow: linear-gradient(135deg, #ffffff, #e8edff);
            --bg1: #101326;
            --bg3: #1e2347;
        }

        body {
            margin: 0;
            font-family: var(--font);
            background: var(--bg1);
            overflow: hidden;
        }


        .parallax-bg {
            position: fixed;
            inset: 0;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 50% 50%, var(--bg3), var(--bg1));
            will-change: transform;
            z-index: -3;
        }

        .layer {
            position: fixed;
            inset: -40%;
            width: 180%;
            height: 180%;
            mix-blend-mode: screen;
            pointer-events: none;
            will-change: transform;
        }

        .layer:nth-child(2) {
            background: radial-gradient(circle, rgba(0,153,255,0.25), transparent 70%);
        }
        .layer:nth-child(3) {
            background: radial-gradient(circle, rgba(255,80,170,0.22), transparent 70%);
        }
        .layer:nth-child(4) {
            background: radial-gradient(circle, rgba(130,80,255,0.18), transparent 70%);
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--space-md);
            color: #fff;
            text-align: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
            animation: fadeIn 1.2s ease;
        }

        .header__title {
            font-size: var(--fs-h1);
            font-weight: 800;
            line-height: var(--lh-tight);
            margin-bottom: var(--space-sm);
            background: var(--text-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .author {
            font-size: var(--fs-author);
            font-weight: 600;
            margin: calc(var(--space-xs) * -0.4) 0 var(--space-sm);
            background: var(--text-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeAuthor 1.3s ease forwards 0.3s;
        }

        @keyframes fadeAuthor {
            from { opacity: 0; transform: translateY(12px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .description__text {
            font-size: var(--fs-text);
            line-height: var(--lh-text);
            opacity: 0.92;
            margin-bottom: var(--space-lg);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .button {
            display: block;
            padding: clamp(14px, 3vw, 20px) clamp(24px, 5vw, 34px);
            font-size: var(--fs-button);
            border-radius: 14px;
            text-decoration: none;
            color: #fff;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            transition: 0.25s ease;
            font-weight: 500;
        }

        .button:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .button--telegram {
            background: linear-gradient(45deg, #0088cc, #00bfff);
            border: none;
        }

        .button--maps {
            background: linear-gradient(45deg, #34a853, #4caf50);
            border: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .page {
                padding: var(--space-sm);
            }
            .container {
                max-width: 90%;
            }
        }

    </style>
</head>

<body>

    <div class="parallax-bg"></div>
    <div class="layer"></div>
    <div class="layer"></div>
    <div class="layer"></div>

    <div class="page">
        <div class="container">
            <h1 class="header__title">Front-end Developer</h1>

            <p class="author">Олександр Долинський</p>

            <p class="description__text">Логіка та оптимізація інтерфейсу</p>

            <div class="actions">
                <a href="tel:+380973234711" class="button">+380 97 323 47 11</a>

                <a href="https://t.me/sasha_08170" class="button button--telegram" target="_blank">
                    Telegram
                </a>

                <a href="https://maps.app.goo.gl/BywmyeLitPvc8C499" class="button button--maps" target="_blank">
                    Google Maps
                </a>
            </div>
        </div>
    </div>

<script>
let targetX = 0, targetY = 0;
let currentX = 0, currentY = 0;

document.addEventListener("mousemove", (e) => {
    targetX = (e.clientX - window.innerWidth / 2) / 150;
    targetY = (e.clientY - window.innerHeight / 2) / 150;
});

function animate() {
    currentX += (targetX - currentX) * 0.07;
    currentY += (targetY - currentY) * 0.07;

    document.querySelector(".parallax-bg").style.transform =
        `translate(${currentX * 10}px, ${currentY * 10}px) scale(1.03)`;

    const layers = document.querySelectorAll(".layer");
    layers.forEach((layer, i) => {
        let depth = (i + 1) * 12;
        layer.style.transform =
            `translate(${currentX * depth}px, ${currentY * depth}px)`;
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
