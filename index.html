    <style>
        :root {
            --font: "Outfit", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            --fs-h1: clamp(2.3rem, 5.4vw, 3.55rem);
            --fs-author: clamp(1.35rem, 2.8vw, 1.9rem);
            --fs-text: clamp(1.1rem, 2.2vw, 1.35rem);
            --fs-btn: clamp(1.05rem, 2vw, 1.2rem);
            --bg-base: hsl(232 42% 7%);
            --glass: hsl(230 32% 14% / 0.7);
            --glass-border: hsl(220 80% 90% / 0.22);
            --depth-shadow: 0 35px 90px hsl(240 60% 5% / 0.7),
                            0 10px 25px hsl(240 90% 5% / 0.35);
        }

        body {
            margin: 0;
            font-family: var(--font);
            background: radial-gradient(circle at top left, hsl(213 100% 35% / 0.22), transparent 55%),
                        radial-gradient(circle at bottom right, hsl(260 80% 40% / 0.24), transparent 55%),
                        var(--bg-base);
            overflow: hidden;
            color: #fff;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            line-height: 1.55;
        }

        .parallax-bg {
            position: fixed;
            inset: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 50% 20%, hsl(222 60% 16% / 0.7), transparent 65%),
                        radial-gradient(circle at 50% 80%, hsl(260 55% 18% / 0.7), transparent 60%);
            z-index: -3;
        }

        .parallax__layer {
            position: fixed;
            inset: -40%;
            width: 180%;
            height: 180%;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        .landing {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .landing__card {
            width: 100%;
            max-width: 44rem;
            padding: 2.5rem;
            text-align: center;
            border-radius: 1.8rem;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(26px) saturate(140%);
            box-shadow: var(--depth-shadow);
            opacity: 0;
            transform: translateY(30px) scale(0.96);
            animation: fadeCard 1.2s ease forwards;
        }

        @keyframes fadeCard {
            0% { opacity: 0; transform: translateY(30px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .landing__title {
            font-size: var(--fs-h1);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            background: linear-gradient(135deg, #fff, #e9edff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: .6rem;
        }

        .landing__author {
            font-size: var(--fs-author);
            opacity: .92;
            font-weight: 500;
            line-height: 1.28;
            letter-spacing: -0.01em;
            margin-bottom: .4rem;
        }

        .landing__tagline {
            font-size: var(--fs-text);
            opacity: .85;
            line-height: 1.45;
            font-weight: 400;
            letter-spacing: 0.005em;
            margin-bottom: 2.1rem;
        }

        .landing__actions {
            display: flex;
            flex-direction: column;
            gap: 1.3rem;
        }

        .landing__button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 2rem;
            border-radius: 999px;
            color: #fff;
            font-size: var(--fs-btn);
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            line-height: 1;
            transition: transform .35s cubic-bezier(.25, .8, .25, 1),
                        box-shadow .35s cubic-bezier(.25, .8, .25, 1),
                        background .35s cubic-bezier(.25, .8, .25, 1);
            transform: translateY(0) scale(1);
        }

        .landing__button:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 0 35px rgba(255,255,255,0.25);
        }

        .landing__button:active {
            transform: scale(0.97);
        }

        .landing__button i {
            margin-right: .55rem;
            font-size: 1.25rem;
            transform: translateY(1px);
        }

        .landing__button--telegram {
            background: linear-gradient(135deg, #1b8fff, #55c8ff);
            box-shadow: 0 0 20px rgba(85, 200, 255, 0.25);
            animation: fadeBtn 1s ease forwards 0.4s;
        }
        .landing__button--telegram:hover {
            background: linear-gradient(135deg, #45a9ff, #7dd8ff);
            box-shadow: 0 0 35px rgba(85, 200, 255, 0.45);
        }

        .landing__button--whatsapp {
            background: linear-gradient(135deg, #1bd267, #37ef87);
            box-shadow: 0 0 20px rgba(55, 239, 135, 0.25);
            animation: fadeBtn 1s ease forwards 0.6s;
        }
        .landing__button--whatsapp:hover {
            background: linear-gradient(135deg, #37ef87, #5bffab);
            box-shadow: 0 0 35px rgba(55, 239, 135, 0.45);
        }

        .landing__button--maps {
            background: linear-gradient(135deg, #ffb340, #ff8800);
            box-shadow: 0 0 20px rgba(255, 153, 0, 0.25);
            animation: fadeBtn 1s ease forwards 0.8s;
        }
        .landing__button--maps:hover {
            background: linear-gradient(135deg, #ffc562, #ff9a1c);
            box-shadow: 0 0 35px rgba(255, 153, 0, 0.45);
        }

        @keyframes fadeBtn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="parallax-bg"></div>
    <div class="parallax__layer"></div>
    <div class="parallax__layer"></div>
    <div class="parallax__layer"></div>

    <main class="landing">
        <section class="landing__card">
            <h1 class="landing__title">Front-end Developer</h1>
            <p class="landing__author">Олександр Долинський</p>
            <p class="landing__tagline">Логіка та інтерфейсна взаємодія</p>

            <nav class="landing__actions">

                <a href="https://t.me/sasha_08170"
                   class="landing__button landing__button--telegram"
                   target="_blank">
                    <i class="fa-brands fa-telegram"></i>
                    Telegram
                </a>

                <a href="https://wa.me/380973234711"
                   class="landing__button landing__button--whatsapp"
                   target="_blank">
                    <i class="fa-brands fa-whatsapp"></i>
                    WhatsApp
                </a>

                <a href="https://maps.app.goo.gl/BywmyeLitPvc8C499"
                   class="landing__button landing__button--maps"
                   target="_blank">
                    <i class="fa-solid fa-location-dot"></i>
                    Google Maps
                </a>

            </nav>
        </section>
    </main>

    <script>
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        document.addEventListener("mousemove", (e) => {
            targetX = (e.clientX - window.innerWidth / 2) / 160;
            targetY = (e.clientY - window.innerHeight / 2) / 160;
        });

        function animate() {
            currentX += (targetX - currentX) * 0.07;
            currentY += (targetY - currentY) * 0.07;

            document.querySelector(".parallax-bg").style.transform =
                `translate(${currentX * 10}px, ${currentY * 10}px) scale(1.03)`;

            document.querySelectorAll(".parallax__layer").forEach((layer, i) => {
                const d = (i + 1) * 10;
                layer.style.transform =
                    `translate(${currentX * d}px, ${currentY * d}px)`;
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
