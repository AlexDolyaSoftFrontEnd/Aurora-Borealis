<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>First in Space</title>
    <style>
        /* Блок: page */
        .page {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://png.pngtree.com/thumb_back/fh260/background/20230704/pngtree-a-stylish-laptop-stands-against-a-cosmic-backdrop-image_3745141.jpg') no-repeat center center/cover;
            opacity: 0.15;
            z-index: 0;
        }

        /* Блок: container */
        .container {
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.8s ease-in;
            position: relative;
            z-index: 1;
        }

        /* Блок: header */
        .header {
            margin-bottom: 30px;
        }

        /* Элемент: header__title */
        .header__title {
            font-size: clamp(2.5em, 6vw, 4em);
            margin: 0 0 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        /* Блок: description */
        .description {
            margin-bottom: 40px;
        }

        /* Элемент: description__text */
        .description__text {
            font-size: clamp(1.1em, 2.5vw, 1.3em);
            margin: 0;
            line-height: 1.7;
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 0.01em;
        }

        /* Блок: actions */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Блок: button */
        .button {
            display: block;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 18px 32px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 500;
            font-size: clamp(1em, 2vw, 1.1em);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.02em;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .button:hover::before {
            opacity: 1;
        }

        .button:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .button:active {
            transform: translateY(0);
        }

        /* Модификатор: button--telegram */
        .button--telegram {
            background: linear-gradient(45deg, #0088cc, #00bfff);
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.8);
        }

        .button--telegram:hover {
            box-shadow: 0 5px 30px rgba(0, 136, 204, 0.9);
        }

        /* Модификатор: button--maps */
        .button--maps {
            background: linear-gradient(45deg, #34a853, #4caf50);
            box-shadow: 0 0 20px rgba(52, 168, 83, 0.8);
        }

        .button--maps:hover {
            box-shadow: 0 5px 30px rgba(52, 168, 83, 0.9);
        }


        /* Элемент: button__text */
        .button__text {
            position: relative;
            z-index: 1;
        }

        /* Анимации */
        @keyframes glowText {
            from {
                text-shadow: 0 0 15px #00e5ff, 0 0 30px #00e5ff;
            }
            to {
                text-shadow: 0 0 25px #ff4081, 0 0 50px #ff4081;
            }
        }

        @keyframes glowBtn {
            from {
                box-shadow: 0 0 20px rgba(255, 64, 129, 0.8), 0 0 40px rgba(255, 87, 34, 0.8);
            }
            to {
                box-shadow: 0 0 30px rgba(0, 229, 255, 0.8), 0 0 60px rgba(0, 229, 255, 0.8);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .page {
                padding: 15px;
            }

            .header {
                margin-bottom: 20px;
            }

            .header__title {
                margin-bottom: 15px;
            }

            .description {
                margin-bottom: 30px;
            }

            .button {
                padding: 16px 25px;
            }
        }

        @media (max-width: 480px) {
            .header__title {
                font-size: 1.75em;
            }

            .description__text {
                font-size: 0.95em;
            }

            .button {
                padding: 14px 20px;
                font-size: 0.95em;
            }
        }

        /* Улучшение доступности */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="page">
    <div class="container">
        <header class="header">
            <h1 class="header__title">First in Space</h1>
        </header>

        <div class="description">
            <p class="description__text">
                Професійна допомога у вирішенні комп'ютерних проблем.<br>
                Звертайтеся, чекаю на ваші повідомлення
            </p>
        </div>

        <div class="actions">
            <a href="tel:+380933168359" class="button">
                <span class="button__text">+380 93 316 8359</span>
            </a>
            <a href="https://t.me/IgorWeretaPC" class="button button--telegram" target="_blank" rel="noopener noreferrer">

                <span class="button__text">Telegram</span>
            </a>
            <a href="https://maps.app.goo.gl/DxKBpGCqzVo5uvG76" class="button button--maps" target="_blank" rel="noopener noreferrer">

                <span class="button__text">Google Maps</span>
            </a>
        </div>
    </div>
</body>
</html>
