    <style>
        :root {
            --text-glow: linear-gradient(135deg, #ffffff, #dbe3ff);
            --font: 'Inter', system-ui, sans-serif;
            --bg1: #101326;
            --bg3: #1e2347;
        }

        body {
            margin: 0;
            font-family: var(--font);
            overflow: hidden;
            background: var(--bg1);
        }

        .parallax-bg {
            position: fixed;
            inset: 0;
            width: 110%;
            height: 110%;
            background: radial-gradient(circle at 50% 50%, var(--bg3), var(--bg1));
            will-change: transform;
            transform: translateZ(0);
            z-index: -3;
        }

        .layer {
            position: fixed;
            inset: -30%;
            width: 160%;
            height: 160%;
            mix-blend-mode: screen;
            pointer-events: none;
            will-change: transform;
        }

        .layer:nth-child(2) {
            background: radial-gradient(circle, rgba(0, 153, 255, 0.25), transparent 70%);
        }

        .layer:nth-child(3) {
            background: radial-gradient(circle, rgba(255, 80, 170, 0.22), transparent 70%);
        }

        .layer:nth-child(4) {
            background: radial-gradient(circle, rgba(130, 80, 255, 0.18), transparent 70%);
        }

        .page {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            text-align: center;
        }

        .container {
            max-width: 650px;
            animation: fadeIn 1s ease;
        }

        .header__title {
            font-size: clamp(2.3rem, 6vw, 4rem);
            margin: 0 0 20px;
            font-weight: 800;
            background: var(--text-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description__text {
            font-size: clamp(1.1rem, 2.3vw, 1.3rem);
            line-height: 1.7;
            opacity: 0.92;
            margin-bottom: 40px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .button {
            display: block;
            padding: 18px 30px;
            border-radius: 14px;
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            transition: 0.25s ease;
            font-weight: 500;
        }

        .button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .button--telegram {
            background: linear-gradient(45deg, #0088cc, #00bfff);
            border: none;
        }

        .button--maps {
            background: linear-gradient(45deg, #34a853, #4caf50);
            border: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>

<body>

                Анімації, логіка та оптимізація інтерфейсу.

                   class="button button--telegram"
                   target="_blank" rel="noopener">
                    Telegram

                <a href="https://maps.app.goo.gl/BywmyeLitPvc8C499"
                   class="button button--maps"
                   target="_blank" rel="noopener">
                    Google Maps
                </a>
            </div>
        </div>
    </div>

<script>
let targetX = 0, targetY = 0;
let currentX = 0, currentY = 0;

document.addEventListener("mousemove", (e) => {
    targetX = (e.clientX - window.innerWidth / 2) / 150;
    targetY = (e.clientY - window.innerHeight / 2) / 150;
});

function animate() {
    currentX += (targetX - currentX) * 0.07;
    currentY += (targetY - currentY) * 0.07;

    document.querySelector(".parallax-bg").style.transform =
        `translate(${currentX * 10}px, ${currentY * 10}px) scale(1.05)`;

    const layers = document.querySelectorAll(".layer");
    layers.forEach((layer, i) => {
        let depth = (i + 1) * 18;
        layer.style.transform =
            `translate(${currentX * depth}px, ${currentY * depth}px)`;
    });

    requestAnimationFrame(animate);
}

animate();
</script>
